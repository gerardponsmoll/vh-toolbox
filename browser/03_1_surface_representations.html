/* shared 2D shape for the grid demos */
const len2 = (x, y) => Math.hypot(x, y);
function sdSeg(px, py, ax, ay, bx, by) { const pax = px - ax, pay = py - ay, bax = bx - ax, bay = by - ay; const hh = clamp((pax * bax + pay * bay) / (bax * bax + bay * bay), 0, 1); return len2(pax - bax * hh, pay - bay * hh); }
function sminf(a, b, k) { const hh = clamp(.5 + .5 * (b - a) / k, 0, 1); return b + (a - b) * hh - k * hh * (1 - hh); }
const blobSDF = (x, y) => {
  const c1 = len2(x + 0.85, y - 0.05) - 0.72, c2 = len2(x - 0.85, y + 0.1) - 0.6;
  const neck = sdSeg(x, y, -0.85, 0.05, 0.85, -0.1) - 0.09;
  const isl = len2(x - 0.15, y - 1.15) - 0.2;
  return Math.min(sminf(sminf(c1, c2, 0.1), neck, 0.12), isl);
};

    const quadLines = m => { const L = []; m.f.forEach(q => q.forEach((a, k) => { const b = q[(k + 1) % 4]; if (a < b) L.push(...m.v[a], ...m.v[b]); })); const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(L, 3)); return g; };
    const surf = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ color: tok('--surface'), roughness: 0.5, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
    const wire = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: tok('--ink'), transparent: true, opacity: 0.35 }));
    const cage = new THREE.LineSegments(quadLines(cube), new THREE.LineBasicMaterial({ color: tok('--accent') }));
    V.scene.add(surf, wire, cage);
    function build3() { let m = cube; for (let i = 0; i < S.lvl; i++) m = cc(m); surf.geometry.dispose(); surf.geometry = toGeo(m); wire.geometry.dispose(); wire.geometry = quadLines(m); wire.visible = S.wire; cage.visible = S.cage; rd.set([['curve points', String(P.length * 2 ** S.it)], ['surface quads', (6 * 4 ** S.lvl).toLocaleString()]]); }
    slider(panel, { id: 'sd-it', label: 'Curve: subdivision steps', min: 0, max: 6, step: 1, value: S.it, f: v => v, onInput: v => { S.it = v; cv.redraw(); build3(); } });
    slider(panel, { id: 'sd-lvl', label: 'Surface: Catmull–Clark levels', min: 0, max: 4, step: 1, value: S.lvl, f: v => v, onInput: v => { S.lvl = v; build3(); } });
    check(panel, { id: 'sd-cage', label: 'Show control cage', checked: S.cage, onChange: v => { S.cage = v; cage.visible = v; } });
    check(panel, { id: 'sd-wire', label: 'Show quads', checked: S.wire, onChange: v => { S.wire = v; wire.visible = v; } });
    const rd = readout(panel);
    panel.append(h('p', { style: 'margin:0;font-size:.86rem;color:var(--muted)' }, 'Chaikin: every edge (a, b) is replaced by ¾a + ¼b and ¼a + ¾b; the limit is a quadratic B-spline. Catmull–Clark adds face and edge points, then averages each old vertex with its neighbours. The limit surface approximates the cage rather than interpolating it.'));
    cv.redraw(); build3();
    return () => { cv.dispose(); V.dispose(); stage.classList.remove('split'); };
  }
});

/* ───────────── router ───────────── */
const nav = document.getElementById('nav'), main = document.getElementById('main');
DEMOS.forEach(d => nav.append(h('a', { href: '#' + d.id, 'data-id': d.id }, d.title, h('small', {}, d.note))));
let cleanup = null, current = null;
function show() {
  const id = (location.hash || '').slice(1); const d = DEMOS.find(x => x.id === id) || DEMOS[0];
  if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
  current = d;
  nav.querySelectorAll('a').forEach(a => a.setAttribute('aria-current', a.dataset.id === d.id ? 'page' : 'false'));
  const stage = h('div', { class: 'stage', id: 'stage' }), panel = h('aside', { class: 'panel', 'aria-label': 'Controls' });
  const [pre, em, post] = d.tryText;
  main.replaceChildren(
    h('div', { class: 'demo-head' }, h('h2', {}, d.title), h('p', {}, d.lead), h('p', { class: 'try' }, pre, h('b', {}, em), post)),
    h('div', { class: 'work' }, stage, panel)
  );
  try { cleanup = d.mount(stage, panel); } catch (e) { console.error(e); stage.append(h('p', { class: 'err' }, 'This demo could not start: ' + e.message)); }
}
addEventListener('hashchange', show);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', show);
new MutationObserver(show).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
show();
</script>
