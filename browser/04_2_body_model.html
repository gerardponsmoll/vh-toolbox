<style>
/* Layout: lab shell — demo list on the left, one live demo at a time (stage + control panel). Tübingen red marks what you can act on. */
:root{
  --bg:#ffffff; --panel:#f5f6f7; --ink:#1d262e; --muted:#5d6872; --line:#e2e5e9;
  --accent:#a51e37; --accent-ink:#ffffff; --gold:#8f7b3c; --slate:#3e5566;
  --surface:#c9ced4; --canvas:#ffffff; --grid:#eef0f2;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121519; --panel:#1a1f24; --ink:#e6eaee; --muted:#9aa5af; --line:#2a3138;
  --accent:#e0566f; --accent-ink:#121519; --gold:#d4c28a; --slate:#9fb6c8;
  --surface:#8d959d; --canvas:#121519; --grid:#1d2329; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121519; --panel:#1a1f24; --ink:#e6eaee; --muted:#9aa5af; --line:#2a3138;
  --accent:#e0566f; --accent-ink:#121519; --gold:#d4c28a; --slate:#9fb6c8;
  --surface:#8d959d; --canvas:#121519; --grid:#1d2329; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-block:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top h1{font-family:var(--font-head);font-weight:600;font-size:1.3rem;margin:0}
.top .sub{color:var(--muted);font-size:.9rem}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 56px)}
nav.demos{border-right:1px solid var(--line);padding-block:12px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
nav.demos a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem;line-height:1.3}
nav.demos a small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
nav.demos a:hover{background:var(--panel)}
nav.demos a[aria-current="page"]{background:var(--panel);color:var(--accent);font-weight:600}
nav.demos a[aria-current="page"] small{font-weight:400}
main{padding-block:18px 28px;padding-left:22px;padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
.demo-head{max-width:78ch}
.demo-head h2{font-family:var(--font-head);font-weight:600;font-size:1.65rem;line-height:1.2;margin:0;text-wrap:balance}
.demo-head p{margin:.4rem 0 0;color:var(--muted)}
.demo-head p.try{color:var(--ink)}
.demo-head p.try b{font-weight:600}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:16px;align-items:start}
.stage{position:relative;background:var(--canvas);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(68vh,620px);min-height:340px;touch-action:none}
.stage canvas{display:block}
.stage.stack{display:grid;grid-template-rows:66fr 34fr}
.stage.stack>div{position:relative;min-height:0;overflow:hidden}
.stage.stack>div+div{border-top:1px solid var(--line)}
.stage .tag{position:absolute;left:12px;top:10px;font-size:.78rem;color:var(--muted);background:color-mix(in srgb,var(--canvas) 85%,transparent);padding:2px 8px;border-radius:6px;pointer-events:none;z-index:2;white-space:nowrap}
.stage .hint{position:absolute;right:12px;bottom:10px;font-size:.78rem;color:var(--muted);pointer-events:none;z-index:2}
.cells{position:absolute;inset:0;pointer-events:none;z-index:2}
.cells .rule{position:absolute;background:var(--line)}
.lbl-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.lbl{font-family:var(--font-head);font-style:italic;font-size:1rem;color:var(--ink);background:color-mix(in srgb,var(--canvas) 75%,transparent);padding:0 5px;border-radius:5px;white-space:nowrap}
.lbl.plain{font-family:var(--font-body);font-style:normal;font-size:.78rem;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.95rem;z-index:3;background:var(--canvas)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--ink);margin-bottom:4px}
.ctl label output{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn:hover,.seg button:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.group-title{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
.read{font-family:var(--font-mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;overflow-x:auto;font-variant-numeric:tabular-nums}
.read dt{color:var(--muted);font-family:var(--font-body);font-size:.84rem}
.read dd{margin:0;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.read .full{grid-column:1/-1}
.read dd.full{margin:0 0 4px 10px}
.verdict{font-size:.92rem;padding:8px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
sub{font-size:.72em;line-height:0}
.note{margin:0;font-size:.86rem;color:var(--muted)}
.bars{width:100%;height:130px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{padding:20px;color:var(--muted)}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.demos{border-right:none;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding-right:max(10px,env(safe-area-inset-right,0px))}
  nav.demos a{white-space:nowrap;flex:0 0 auto}
  nav.demos a small{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{height:62vh}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
