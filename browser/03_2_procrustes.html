      for (let i = 0; i < nWrong; i++) { const j = i + Math.floor(R() * (Y.length - i)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      const perm = idx.slice(0, nWrong); const shuffled = perm.slice().sort(() => R() - 0.5); const Y2 = Y.slice(); perm.forEach((a, k) => Y2[a] = Y[shuffled[k]]); Y = Y2;
      truth = { R: S.mirror ? M3.mul(Rt, [[-1, 0, 0], [0, 1, 0], [0, 0, 1]]) : Rt, s: st, t: tt };
      sol = procrustes(X, Y, { scale: S.scale, noReflect: S.noReflect });
    }
    // configuration of both clouds at a (possibly fractional) stage
    function config(stg) {
      const k = Math.floor(stg), f = stg - k, { mx, my, R, s } = sol;
      const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().set(R[0][0], R[0][1], R[0][2], 0, R[1][0], R[1][1], R[1][2], 0, R[2][0], R[2][1], R[2][2], 0, 0, 0, 0, 1));
      const rotFrac = g => { if (sol.d * sol.detUV < 0 || M3.det(R) < 0) return g < 0.5 ? M3.I() : R; const qq = new THREE.Quaternion().slerp(q, g); const m = new THREE.Matrix4().makeRotationFromQuaternion(qq).elements; return [[m[0], m[4], m[8]], [m[1], m[5], m[9]], [m[2], m[6], m[10]]]; };
      const shiftX = clamp(stg, 0, 1), shiftBack = clamp(stg - 3, 0, 1);
      const Rk = stg >= 2 ? R : stg > 1 ? rotFrac(stg - 1) : M3.I();
      const sk = stg >= 3 ? s : stg > 2 ? 1 + (s - 1) * (stg - 2) : 1;
      const S2 = X.map(p => { const c = p.map((x, d) => x - mx[d] * shiftX); const r = M3.mv(Rk, c); return r.map((x, d) => sk * x + my[d] * shiftBack); });
      const T2 = Y.map(p => p.map((y, d) => y - my[d] * shiftX + my[d] * shiftBack));
      return [S2, T2];
    }
    function rms(A, B) { let e = 0; for (let i = 0; i < A.length; i++) e += (A[i][0] - B[i][0]) ** 2 + (A[i][1] - B[i][1]) ** 2 + (A[i][2] - B[i][2]) ** 2; return Math.sqrt(e / A.length); }
    function show(stg) {
      const [A, Bp] = config(stg); src.setPts(A); tgt.setPts(Bp);
      const L = []; for (let i = 0; i < A.length; i += 6) L.push(...A[i], ...Bp[i]); links.geometry.dispose(); links.geometry = new THREE.BufferGeometry(); links.geometry.setAttribute('position', new THREE.Float32BufferAttribute(L, 3)); links.visible = S.links;
      const cen = P => P.reduce((a, p) => a.map((x, d) => x + p[d] / P.length), [0, 0, 0]); cA.position.set(...cen(A)); cB.position.set(...cen(Bp));
      const k = Math.round(stg); stepLabel.textContent = steps[k];
      const e = rms(A, Bp);
      const rows = [['step', steps[k]], ['RMS error', fmt(e, 4)]];
      if (k >= 1) rows.push(['x̄', `(${sol.mx.map(x => fmt(x)).join(', ')})`], ['ȳ', `(${sol.my.map(x => fmt(x)).join(', ')})`]);
      if (k >= 2) rows.push(['ȲᵀX̄ = UΣVᵀ', `σ = ${sol.S.map(x => fmt(x, 2)).join(', ')}`], ['det(UVᵀ)', sol.detUV > 0 ? '+1' : '−1  (reflection)'], ['R', M3.str(sol.R, 2)]);
      if (k >= 3) rows.push(['s = tr(Σ)/‖X̄‖²', `${fmt(sol.s, 3)}   (true ${fmt(truth.s, 3)})`]);
      if (k >= 4) rows.push(['t', `(${sol.t.map(x => fmt(x)).join(', ')})`], ['error vs. true R', M3.det(M3.mul(M3.T(truth.R), sol.R)) > 0 ? `${fmt(rotAngle(M3.mul(M3.T(truth.R), sol.R)), 2)}°` : 'cannot match (det differs)']);
      rd.set(rows);
      let msg = '';
      if (k === 4) {
        if (S.mirror && S.noReflect) msg = 'The target is a mirror image. With det(R) = +1 enforced, no rotation can match it — the error stays large.';
        else if (S.mirror) msg = 'Reflections allowed: R has det = −1, so it is not a rotation. This is why the det correction exists.';
        else if (S.wrong > 0) msg = `Wrong correspondences pull the estimate off. Procrustes assumes xᵢ ↔ yᵢ are correct — finding them is the job of ICP (next lecture).`;
        else if (!S.scale && Math.abs(truth.s - 1) > 0.05) msg = 'Scale is fixed to 1 but the target is scaled: the best rigid fit cannot close the gap.';
        else msg = S.noise > 0.03 ? 'With noise there is no exact fit; this is the least-squares optimum.' : 'Aligned. The remaining error is the noise level.';
      }
      note.textContent = msg; note.hidden = !msg;
    }
    function goTo(target) {
      if (S.anim) cancelAnimationFrame(S.anim);
      const from = S.stage, t0 = performance.now(), dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 700 * Math.abs(target - from);
      const tick = now => { const f = clamp((now - t0) / dur, 0, 1), e = f < 0.5 ? 2 * f * f : 1 - (-2 * f + 2) ** 2 / 2; S.stage = from + (target - from) * e; show(S.stage); if (f < 1) S.anim = requestAnimationFrame(tick); else { S.stage = target; show(target); S.anim = null; } };
      S.anim = requestAnimationFrame(tick);
    }
    const stepLabel = h('div', { class: 'tag' }); stage.append(stepLabel);
    stage.append(h('div', { class: 'hint' }, 'blue: source X   ·   red: target Y   ·   lines: correspondences'));
    groupTitle(panel, 'Solve');
    const r1 = h('div', { class: 'row' }); panel.append(r1);
    button(r1, 'Run all', () => { if (S.stage >= 4) { S.stage = 0; show(0); } goTo(4); }, true);
    button(r1, 'Next step', () => goTo(Math.min(4, Math.round(S.stage) + 1)));
    button(r1, 'Reset', () => { if (S.anim) cancelAnimationFrame(S.anim); S.stage = 0; show(0); });
    const note = verdict(panel); note.hidden = true;
    groupTitle(panel, 'Target');
    const rebuild = () => { makeTarget(); if (S.anim) cancelAnimationFrame(S.anim); S.stage = 0; show(0); };
    button(panel, 'New random target', () => { S.seed++; rebuild(); });
    slider(panel, { id: 'pr-noise', label: 'Noise σ', min: 0, max: 0.08, step: 0.002, value: S.noise, f: v => fmt(v, 3), onInput: v => { S.noise = v; rebuild(); } });
    slider(panel, { id: 'pr-wrong', label: 'Wrong correspondences', min: 0, max: 60, step: 1, value: S.wrong, f: v => v + '%', onInput: v => { S.wrong = v; rebuild(); } });
    check(panel, { id: 'pr-mirror', label: 'Mirror the target (reflection)', checked: false, onChange: v => { S.mirror = v; rebuild(); } });
    groupTitle(panel, 'Solver options');
    check(panel, { id: 'pr-scale', label: 'Estimate scale s', checked: true, onChange: v => { S.scale = v; rebuild(); } });
    check(panel, { id: 'pr-refl', label: 'Force det(R) = +1', checked: true, onChange: v => { S.noReflect = v; rebuild(); } });
    check(panel, { id: 'pr-links', label: 'Show correspondences', checked: true, onChange: v => { S.links = v; links.visible = v; } });
    const rd = readout(panel);
    makeTarget(); show(0);
    return () => { if (S.anim) cancelAnimationFrame(S.anim); V.dispose(); };
  }
});

/* ───────────── router ───────────── */
const nav = document.getElementById('nav'), main = document.getElementById('main');
DEMOS.forEach(d => nav.append(h('a', { href: '#' + d.id, 'data-id': d.id }, d.title, h('small', {}, d.note))));
let cleanup = null, current = null;
function show() {
  const id = (location.hash || '').slice(1); const d = DEMOS.find(x => x.id === id) || DEMOS[0];
  if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
  current = d;
  nav.querySelectorAll('a').forEach(a => a.setAttribute('aria-current', a.dataset.id === d.id ? 'page' : 'false'));
  const stage = h('div', { class: 'stage', id: 'stage' }), panel = h('aside', { class: 'panel', 'aria-label': 'Controls' });
  const [pre, em, post] = d.tryText;
  main.replaceChildren(
    h('div', { class: 'demo-head' }, h('h2', {}, d.title), h('p', {}, d.lead), h('p', { class: 'try' }, pre, h('b', {}, em), post)),
    h('div', { class: 'work' }, stage, panel)
  );
  try { cleanup = d.mount(stage, panel); } catch (e) { console.error(e); stage.append(h('p', { class: 'err' }, 'This demo could not start: ' + e.message)); }
}
addEventListener('hashchange', show);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', show);
new MutationObserver(show).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
show();
</script>
