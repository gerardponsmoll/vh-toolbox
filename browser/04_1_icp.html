<style>
/* Layout: lab shell — demo list on the left, one live demo at a time (stage + control panel). Tübingen red marks the target and what you can act on; green is the source shape. */
:root{
  --bg:#ffffff; --panel:#f5f6f7; --ink:#1d262e; --muted:#5d6872; --line:#e2e5e9;
  --accent:#a51e37; --accent-ink:#ffffff; --gold:#8f7b3c; --slate:#3e5566; --src:#3f8f3a;
  --surface:#c9ced4; --canvas:#ffffff; --grid:#eef0f2;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121519; --panel:#1a1f24; --ink:#e6eaee; --muted:#9aa5af; --line:#2a3138;
  --accent:#e0566f; --accent-ink:#121519; --gold:#d4c28a; --slate:#9fb6c8; --src:#7cc174;
  --surface:#8d959d; --canvas:#121519; --grid:#1d2329; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121519; --panel:#1a1f24; --ink:#e6eaee; --muted:#9aa5af; --line:#2a3138;
  --accent:#e0566f; --accent-ink:#121519; --gold:#d4c28a; --slate:#9fb6c8; --src:#7cc174;
  --surface:#8d959d; --canvas:#121519; --grid:#1d2329; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-block:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top h1{font-family:var(--font-head);font-weight:600;font-size:1.3rem;margin:0}
.top .sub{color:var(--muted);font-size:.9rem}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 56px)}
nav.demos{border-right:1px solid var(--line);padding-block:12px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
nav.demos a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem;line-height:1.3}
nav.demos a small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
nav.demos a:hover{background:var(--panel)}

nav.demos a[aria-current="page"] small{font-weight:400}
main{padding-block:18px 28px;padding-left:22px;padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
.demo-head{max-width:78ch}
.demo-head h2{font-family:var(--font-head);font-weight:600;font-size:1.65rem;line-height:1.2;margin:0;text-wrap:balance}
.demo-head p{margin:.4rem 0 0;color:var(--muted)}
.demo-head p.try{color:var(--ink)}
.demo-head p.try b{color:var(--ink);font-weight:600}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:16px;align-items:start}
.stage{position:relative;background:var(--canvas);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(68vh,620px);min-height:340px;touch-action:none}
.stage canvas{display:block}
.stage.split{display:grid;grid-template-columns:1fr 1fr}
.stage.split>div{position:relative;min-width:0;min-height:0}
.stage.split>div+div{border-left:1px solid var(--line)}
.stage.stack{display:grid;grid-template-rows:66fr 34fr}
.stage.stack>div{position:relative;min-height:0;min-width:0}
.stage.stack>div+div{border-top:1px solid var(--line)}
.sub2{display:grid;grid-template-rows:62fr 38fr}
.sub2>div{position:relative;min-height:0;min-width:0}
.sub2>div+div{border-top:1px solid var(--line)}
.stage .tag{position:absolute;left:12px;top:10px;font-size:.78rem;color:var(--muted);background:color-mix(in srgb,var(--canvas) 85%,transparent);padding:2px 8px;border-radius:6px;pointer-events:none;z-index:2;font-variant-numeric:tabular-nums}
.stage .hint{position:absolute;right:12px;bottom:10px;font-size:.78rem;color:var(--muted);pointer-events:none;z-index:2;background:color-mix(in srgb,var(--canvas) 85%,transparent);padding:1px 6px;border-radius:6px}
.stage .lbl3{position:absolute;font-family:var(--font-head);font-style:italic;font-size:.95rem;color:var(--ink);pointer-events:none;transform:translate(-50%,-140%);white-space:nowrap;z-index:2}
.fillchart{position:absolute;inset:0;width:100%;height:100%}
.chart{width:100%;display:block;background:var(--canvas);border:1px solid var(--line);border-radius:8px}

.seg{display:flex;flex-wrap:wrap;gap:6px}

.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn:hover,.seg button:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.group-title{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
.read{font-family:var(--font-mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;overflow-x:auto;font-variant-numeric:tabular-nums}
.read dt{color:var(--muted);min-width:0}
.read dd{margin:0;color:var(--ink);white-space:pre;text-align:right}
.read dd.full{text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.read .full{grid-column:1/-1}
.read dd.full{margin:0 0 4px 10px}
.verdict{font-size:.92rem;padding:8px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.note{margin:0;font-size:.86rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid currentColor;vertical-align:middle;margin-right:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{padding:20px;color:var(--muted)}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}

  nav.demos a{white-space:nowrap;flex:0 0 auto}
  nav.demos a small{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{height:60vh}
  .stage.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:92vh}
  .stage.split>div+div{border-left:none;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

/* 2 — ICP step by step */
DEMOS.push({
  id: 'icp', title: 'ICP, step by step', note: 'Correspondences ⇄ Procrustes',
  lead: 'Iterative Closest Point alternates two problems that are easy on their own. With f fixed, find the closest points; with the pairs fixed, solve for the best f = {R, t, s} with Procrustes. Both steps minimise the same E, so the error never increases.',
  tryText: ['Press ', 'Step', ' to walk through one iteration j at a time, or Run to iterate until the error stops changing. Then set the initial rotation θ₀ to 0° and run again.'],
  mount(stage, panel) {
    const S = { init: 'centroid', th0: 40, dir: 't2s', scale: true, f: null, j: 0, phase: 0, c: null, next: null, hist: [], disp: null, done: false, running: false, timer: 0, anim: 0, msg: '' };
    const cv = canvas2d(stage, draw, extFor(S.init));
    const tag = h('div', { class: 'tag' }); stage.append(tag);
    const labels = ['Find correspondences', 'Solve Procrustes', 'Apply the transform'];
    function draw(cv) {
      const f = S.disp || S.f;
      const FX = map2(f, X2);
      if (S.phase >= 1 && S.c && !S.disp) pairLines(cv, S.c.si.map(j => S.c.FX[j]), S.c.ti.map(i => Y2[i]), tok('--muted'), 2, 1, 0.8);
      path(cv, map2(f0(S.init, rad(S.th0)), X2), tok('--muted'), 1.2, true, [4, 5], 0.6);
      path(cv, Y2, tok('--accent'), 2.4);

    }
    function info() {
      const rows = [['j', String(S.j)], ['f', fStr(S.f)]];

      stepB.textContent = S.done ? 'Converged' : labels[S.phase]; stepB.disabled = S.done || S.running;

      if (S.arrows && c) { const { ctx } = cv; for (let q = 0; q < c.si.length; q += 4) { const a = c.FX[c.si[q]], y = Y2[c.ti[q]]; arrow(ctx, cv.sx(a[0]), cv.sy(a[1]), cv.sx(y[0]), cv.sy(y[1]), tok('--muted'), 1, 6); } }
      if (FX.every(p => Number.isFinite(p[0]))) path(cv, FX, tok('--src'), 2.4);
      tag.textContent = `iteration j = ${j} · E = ${fmt(R.E[j], 4)}` + (R.diverged >= 0 && j >= R.diverged ? ' · diverged' : '');
    }
    function drawChart() {
      const R = S.res, j = Math.min(S.frame, R.hist.length - 1);
      ch.draw([{ data: R.pE.slice(0, j + 1), color: tok('--slate'), dash: [6, 4] }, { data: R.E.slice(0, j + 1), color: tok('--accent') }], { log: true, floor: 1e-5, xmin: 0, xmax: S.iters - 1, xticks: [0, Math.round((S.iters - 1) / 2), S.iters - 1], xlabel: 'iteration j', ylabel: 'E / N', ytop: 10 });
      const f = R.hist[j];
      rd.set([['α', fmt(S.alpha, 3)], ['gradient steps per j', String(S.inner)], ['E / N, gradient', fmt(R.E[j], 5)], ['E / N, Procrustes', fmt(R.pE[Math.min(j, R.pE.length - 1)], 5)], ['f, gradient', fStr(f)]]);
      const last = R.E[R.E.length - 1];
      vd.textContent = R.diverged >= 0 ? `Diverged at iteration ${R.diverged}: α is too large for the curvature of E, so each step overshoots the minimum.` : last > 1.5 * R.pE[R.pE.length - 1] + 2e-5 ? 'Still converging: with this α the steps are too small to keep up with Procrustes-ICP.' : 'Converged: the gradient steps reach the same minimum as the closed-form Procrustes steps.';
    }
    function play() { cancelAnimationFrame(S.anim); const n = S.res.hist.length - 1, t0 = performance.now(), per = reduced() ? 0 : 110; const tick = now => { S.frame = per ? clamp(Math.floor((now - t0) / per), 0, n) : n; cv.redraw(); drawChart(); if (S.frame < n) S.anim = requestAnimationFrame(tick); }; S.anim = requestAnimationFrame(tick); }
    function rebuild() { simulate(); play(); }
    const r = h('div', { class: 'row' }); panel.append(r); button(r, 'Replay', play, true);
    const vd = verdict(panel);
    slider(panel, { id: 'gd-a', label: 'step size α', min: 0.005, max: 2, step: 0.005, value: S.alpha, f: v => fmt(v, 3), onInput: v => { S.alpha = v; rebuild(); } });
    slider(panel, { id: 'gd-k', label: 'gradient steps per iteration', min: 1, max: 20, step: 1, value: S.inner, f: v => String(v), onInput: v => { S.inner = v; rebuild(); } });
    slider(panel, { id: 'gd-th', label: 'initial rotation θ₀', min: -90, max: 90, step: 5, value: S.th0, f: v => v + '°', onInput: v => { S.th0 = v; rebuild(); } });
    check(panel, { id: 'gd-ar', label: 'Show residuals f(xᵢ) → yᵢ', checked: true, onChange: v => { S.arrows = v; cv.redraw(); } });
    const rd = readout(panel);
    legend(panel, [[tok('--accent'), 'gradient-based ICP'], [tok('--slate'), 'Procrustes-ICP', true]]);
    note(panel, 'E is averaged over the N pairs so that α does not depend on N. Rotation and scale act about the source centroid, which keeps the parameters on a similar scale.');
    rebuild();
    return () => { cancelAnimationFrame(S.anim); cv.dispose(); ch.dispose(); };
  }
});

/* 7 — ICP in 3D */
DEMOS.push({
  id: 'icp3d', title: 'ICP in 3D', note: 'Noise, outliers, partial scans',
  lead: 'The same algorithm aligns 3D point clouds. Real scans add noise, outliers and missing parts. Pairing from the target to the source and trimming the worst pairs keep the estimate stable.',
  tryText: ['Press ', 'Run', ', then switch on outliers or a partial scan and compare plain ICP with trimmed ICP.'],
  mount(stage, panel) {
    const V = viewer(stage, { cam: [2.6, -5.6, 2.1], target: [0.3, 0, 0] });
    const X = humanCloud(650, 7);
    const src = pointsObject(tok('--src'), 0.034), tgt = pointsObject(tok('--accent'), 0.034), outl = pointsObject(tok('--muted'), 0.03), links = segObject(tok('--muted'), 0.45);
    V.scene.add(src, tgt, outl, links);
    const tag = h('div', { class: 'tag' }); stage.append(tag);
    const S = { seed: 4, noise: 0.01, outliers: false, partial: false, trim: 0, init: 'centroid', links: true, f: null, j: 0, rms: [], running: false, done: false, timer: 0 };
    let Y = [], isOut = [], truth = null;
    function makeTarget() {
      const R = rng(S.seed * 7919 + 5); let ax = [gauss(R), gauss(R), gauss(R)]; const l = Math.hypot(...ax); ax = ax.map(v => v / l);
      const Rt = axisAngle(ax, rad(10 + 15 * R())), st = 0.8 + 0.4 * R(), tt = [1.0 + 0.6 * R(), R() * 0.8 - 0.4, R() * 0.5 - 0.25];
      let P = humanCloud(650, 100 + S.seed); if (S.partial) P = P.filter(p => p[0] < 0.18);
      const Rn = rng(S.seed * 31 + 7);
      Y = P.map(p => { const r = M3.mv(Rt, p); return [st * r[0] + tt[0] + S.noise * gauss(Rn), st * r[1] + tt[1] + S.noise * gauss(Rn), st * r[2] + tt[2] + S.noise * gauss(Rn)]; }); isOut = Y.map(() => false);
      if (S.outliers) { const lo = [0, 1, 2].map(d => Math.min(...Y.map(p => p[d])) - 0.3), hi = [0, 1, 2].map(d => Math.max(...Y.map(p => p[d])) + 0.3); const n = Math.round(0.15 * Y.length); for (let k = 0; k < n; k++) { Y.push([0, 1, 2].map(d => lo[d] + (hi[d] - lo[d]) * Rn())); isOut.push(true); } }
      truth = { R: Rt, s: st, t: tt };
      const c = [0, 1, 2].map(d => Y.reduce((a, p) => a + p[d], 0) / Y.length); V.controls.target.set(...c); V.camera.position.set(c[0] + 1.5, c[1] - 3.7, c[2] + 1.1); V.controls.update();
      tgt.setPts(Y.filter((_, i) => !isOut[i])); outl.setPts(Y.filter((_, i) => isOut[i]));
    }
    const apply = (f, p) => { const r = M3.mv(f.R, p); return [f.s * r[0] + f.t[0], f.s * r[1] + f.t[1], f.s * r[2] + f.t[2]]; };
    function reset() {
      S.running = false; clearTimeout(S.timer);
      const mx = [0, 1, 2].map(d => X.reduce((a, p) => a + p[d], 0) / X.length), my = [0, 1, 2].map(d => Y.reduce((a, p) => a + p[d], 0) / Y.length);
      S.f = { R: M3.I(), s: 1, t: S.init === 'centroid' ? my.map((v, d) => v - mx[d]) : [0, 0, 0] }; S.j = 0; S.rms = []; S.done = false; S.pairs = null; show();
    }
    function iterate() {
      const FX = X.map(p => apply(S.f, p)); const pairs = [];
      for (let i = 0; i < Y.length; i++) { let bj = 0, bd = Infinity; const y = Y[i]; for (let j = 0; j < FX.length; j++) { const a = FX[j], d = (a[0] - y[0]) ** 2 + (a[1] - y[1]) ** 2 + (a[2] - y[2]) ** 2; if (d < bd) { bd = d; bj = j; } } pairs.push([bj, i, bd]); }
      pairs.sort((a, b) => a[2] - b[2]); const keep = pairs.slice(0, Math.max(10, Math.round(pairs.length * (1 - S.trim / 100))));
      const rms = Math.sqrt(keep.reduce((a, p) => a + p[2], 0) / keep.length); S.rms.push(rms); S.pairs = keep;
      if (S.rms.length > 1 && Math.abs(S.rms[S.rms.length - 2] - rms) < 1e-5 || S.j >= 80) { S.done = true; show(); return; }
      S.f = procrustes3(keep.map(p => X[p[0]]), keep.map(p => Y[p[1]])); S.j++; show();
    }
    function show() {
      const FX = X.map(p => apply(S.f, p)); src.setPts(FX);
      const L = []; if (S.links && S.pairs) S.pairs.forEach((p, k) => { if (k % 6 === 0) { const a = FX[p[0]], b = Y[p[1]]; L.push(...a, ...b); } }); links.setSegs(L); links.visible = S.links;
      const Rerr = rotAngle(M3.mul(M3.T(truth.R), S.f.R));
      const c0 = [0, 0.05, 0.2], ce = apply(S.f, c0), ct = apply(truth, c0);
      rd.set([['iteration j', String(S.j)], ['RMS (kept pairs)', S.rms.length ? fmt(S.rms[S.rms.length - 1], 4) : '—'], ['scale s', fmt(S.f.s, 3)], ['true scale', fmt(truth.s, 3)], ['rotation error', fmt(Rerr, 2) + '°'], ['position error', fmt(Math.hypot(ce[0] - ct[0], ce[1] - ct[1], ce[2] - ct[2]), 3)]]);
      ch.draw([{ data: S.rms.slice(), color: tok('--accent') }], { log: true, floor: 1e-4, xlabel: 'iteration j', xmin: 0, xmax: Math.max(5, S.rms.length - 1), xticks: [0, Math.max(5, S.rms.length - 1)], ytop: 1 });
      tag.textContent = `iteration j = ${S.j}` + (S.done ? ' · converged' : '');
      runB.textContent = S.running ? 'Pause' : 'Run'; runB.disabled = S.done; stepB.disabled = S.done || S.running;
      if (S.done) {
        const head = S.j >= 80 ? 'Stopped after 80 iterations without converging' : `Converged after ${S.j} iterations`;
        vd.textContent = Rerr < 3 ? `${head}; the rotation is within ${fmt(Rerr, 1)}° of the truth.` : `${head}, but the rotation is off by ${fmt(Rerr, 0)}°.` + (S.outliers && S.trim === 0 ? ' The outliers pull the estimate towards them: trim the worst pairs.' : S.trim > 0 ? ' Trimming also discards valid pairs, and ICP has settled in a local minimum: try a smaller trim or a new target.' : ' ICP has settled in a local minimum.');
      }
      vd.hidden = !S.done;
    }
    function run() { if (S.running) { S.running = false; clearTimeout(S.timer); show(); return; } S.running = true; const loop = () => { if (!S.running) return; iterate(); if (S.done) { S.running = false; show(); return; } S.timer = setTimeout(loop, reduced() ? 0 : 90); }; loop(); }
    const rebuild = () => { makeTarget(); reset(); };
    groupTitle(panel, 'Iterate');
    const r1 = h('div', { class: 'row' }); panel.append(r1);
    const runB = button(r1, 'Run', run, true); const stepB = button(r1, 'Step', () => { if (!S.done) iterate(); }); button(r1, 'Reset', reset);
    const vd = verdict(panel); vd.hidden = true;
    const chHost = h('div'); panel.append(chHost); const ch = makeChart(chHost, { height: 110 });
    const rd = readout(panel);
    groupTitle(panel, 'Target scan');
    button(panel, 'New random target', () => { S.seed++; rebuild(); });
    slider(panel, { id: 'i3-noise', label: 'noise σ', min: 0, max: 0.04, step: 0.002, value: S.noise, f: v => fmt(v, 3), onInput: v => { S.noise = v; rebuild(); } });
    check(panel, { id: 'i3-out', label: 'Add 15% outliers', checked: false, onChange: v => { S.outliers = v; rebuild(); } });
    check(panel, { id: 'i3-part', label: 'Partial scan (left arm missing)', checked: false, onChange: v => { S.partial = v; rebuild(); } });
    groupTitle(panel, 'ICP options');
    seg(panel, { id: 'i3-init', options: [['centroid', 'align centroids'], ['identity', 'R = I, t = 0']], value: S.init, onChange: v => { S.init = v; reset(); } });
    slider(panel, { id: 'i3-trim', label: 'trim the worst pairs', min: 0, max: 40, step: 5, value: S.trim, f: v => v + '%', onInput: v => { S.trim = v; reset(); } });
    check(panel, { id: 'i3-links', label: 'Show correspondences', checked: true, onChange: v => { S.links = v; show(); } });
    legend(panel, [[tok('--src'), 'source X'], [tok('--accent'), 'target scan Y'], [tok('--muted'), 'outliers']]);
    rebuild();
    return () => { S.running = false; clearTimeout(S.timer); V.dispose(); ch.dispose(); };
  }
});

/* ───────────── router ───────────── */
const nav = document.getElementById('nav'), main = document.getElementById('main');
DEMOS.forEach(d => nav.append(h('a', { href: '#' + d.id, 'data-id': d.id }, d.title, h('small', {}, d.note))));
let cleanup = null;
function show() {
  const id = (location.hash || '').slice(1); const d = DEMOS.find(x => x.id === id) || DEMOS[0];
  if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
  nav.querySelectorAll('a').forEach(a => a.setAttribute('aria-current', a.dataset.id === d.id ? 'page' : 'false'));
  const stage = h('div', { class: 'stage', id: 'stage' }), panel = h('aside', { class: 'panel', 'aria-label': 'Controls' });
  const [pre, em, post] = d.tryText;
  main.replaceChildren(
    h('div', { class: 'demo-head' }, h('h2', {}, d.title), h('p', {}, d.lead), h('p', { class: 'try' }, pre, h('b', {}, em), post)),
    h('div', { class: 'work' }, stage, panel)
  );
  try { cleanup = d.mount(stage, panel); } catch (e) { console.error(e); stage.append(h('p', { class: 'err' }, 'This demo could not start: ' + e.message)); }
}
addEventListener('hashchange', show);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', show);
new MutationObserver(show).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
show();
</script>
